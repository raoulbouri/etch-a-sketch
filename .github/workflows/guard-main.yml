name: guard-main
# CLAUDE.md and MEMORY.md are working docs for the dev branch only. Fail if they reach main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  no-agent-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # on a PR this is the merge result that would land on main
      - name: CLAUDE.md and MEMORY.md must not be tracked on main
        run: |
          found=$(git ls-files CLAUDE.md MEMORY.md)
          if [ -n "$found" ]; then
            echo "::error::These files belong on dev only: $found. Update main with scripts/promote_main.sh."
            exit 1
          fi
          echo "ok: no CLAUDE.md / MEMORY.md on main"
