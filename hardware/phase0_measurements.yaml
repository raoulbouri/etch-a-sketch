# Phase 0 hardware measurements. Fill in; null = not measured yet.
# These replace the placeholders in etch_sim (AxisParams, ToyParams, Timing).
toy:
  model: null                      # classic / pocket
  screen_mm: {x: null, y: null}    # drawable area (proposal cites ~153 x 107 for the classic)
  knob_diameter_mm: null
  knob_centre_spacing_mm: null
  mass_g: null
  sign_convention:                 # turn each knob clockwise seen from the front: which way does the pen go?
    left_knob_cw_moves: right       # right / left
    right_knob_cw_moves: up      # up / down

knob:                              # per axis: sweep by hand or arm, log to CSV, run scripts/fit_hand_measurements.py
  x: {k_mm_per_deg: 0.09507, delta_deg: 10.57, fit_rms_mm: 0.224, turns_across_screen: 4.47}   # hand full turns 2026-11-22: backlash 21.13 deg
  y: {k_mm_per_deg: 0.10014, delta_deg: 8.4, fit_rms_mm: 0.765, turns_across_screen: 2.97}   # hand full turns 2026-11-22: backlash 16.81 deg
  dead_zone_varies_near_edges: null

grasp:
  slip_deg_per_turn: null          # gate: under 2 deg per turn over 10 turns
  knob_cap_used: null
  switch_time_s: null              # release, move to the other knob, regrasp
  knob_speed_used_dps: null

erase:                             # gate: residual under 5% within 60 s
  held_by: null                    # arm on frame / fixture
  peak_speed_mps: null
  shake_freq_hz: null
  duration_s: null
  residual_fraction: null

camera:
  scene_camera: null               # model and mount position
  line_contrast_ok: null
  pen_tip_visible: null
  glare_notes: null

markers:                           # ArUco 4x4_50 stuck on the toy frame, seen from the knob side: 0 TL, 1 TR, 2 BR, 3 BL
  black_square_mm: 21.6            # ruler 2026-11-24 (designed 22.5; printed at ~96 %, i.e. scaled to fit the page)
  centre_distances_mm:             # ruler, Raoul 2026-11-24 (board moved to measure)
    "0-1": 187.5
    "1-2": 148.5
    "2-3": 128.0                   # re-measured 2026-11-24 (first reading 149 was off; camera and planar fit gave ~128)
    "3-0": 148.0
    "0-2": 215.0
    "1-3": 212.0
  knob_to_marker_mm:               # ruler, Raoul 2026-11-24 (toy at the green arm); reference points as Raoul measured them
    "y_knob-2": 31.0               # right knob to the lower-right marker (id2)
    "x_knob-3": 35.0               # left knob to the lower-left marker (id3)
