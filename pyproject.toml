[project]
name = "etch-sim"
version = "0.1.0"
description = "Etch-a-Sketch robot artist: simulation, perception and real-arm skills for a Kinova Gen3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=4.0.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.8.1",
    "pytest>=9.2.0",
]
realsense = [
    "pyrealsense2>=2.55 ; sys_platform == 'linux'",
]
